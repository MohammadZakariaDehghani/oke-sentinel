apiVersion: beat.k8s.elastic.co/v1beta1
kind: Beat
metadata:
  name: filebeat
  namespace: elastic-system
  labels:
    app.kubernetes.io/part-of: oke-sentinel
spec:
  type: filebeat
  version: 9.5.0
  elasticsearchRef:
    name: sentinel

  config:
    # ---------------------------------------------------------------------
    # Container logs
    # ---------------------------------------------------------------------
    # Autodiscover rather than a static path: pods come and go, and the
    # container runtime's log paths encode pod UIDs that no static glob can
    # keep up with.
    filebeat.autodiscover:
      providers:
        - type: kubernetes
          node: ${NODE_NAME}
          hints.enabled: true
          hints.default_config:
            type: container
            paths:
              - /var/log/containers/*-${data.kubernetes.container.id}.log
            # The sample workload writes structured JSON. Parsing it here means
            # its fields are queryable rather than buried in a message string.
            # add_error_key surfaces malformed lines instead of dropping them.
            json:
              keys_under_root: true
              add_error_key: true
              message_key: message
              overwrite_keys: true
              expand_keys: true

    # ---------------------------------------------------------------------
    # Kubernetes audit log
    # ---------------------------------------------------------------------
    # This input only produces anything where the API server writes an audit
    # file to the node — that is, a self-managed control plane, which in this
    # project means kind. On OKE the control plane is managed and there is no
    # file; audit events arrive through OCI Streaming instead, configured in
    # the prod overlay. Both paths write to the same data stream, so the
    # detection rules do not care which one produced the event.
    filebeat.inputs:
      - type: filestream
        id: kubernetes-audit
        enabled: true
        paths:
          - /var/log/kubernetes/audit/audit.log
        parsers:
          - ndjson:
              target: ""
              add_error_key: true
              overwrite_keys: true
        # Audit events are already structured; tagging them is what routes them
        # to the audit data stream in the output below.
        tags: ["kubernetes-audit"]
        fields_under_root: true
        fields:
          event.dataset: kubernetes.audit
          event.module: kubernetes

    processors:
      - add_cloud_metadata: {}
      - add_host_metadata: {}
      # Drop Filebeat's own logs. Without this, an error writing to
      # Elasticsearch produces a log line that Filebeat then tries to ship to
      # Elasticsearch, which fails, which produces a log line.
      - drop_event:
          when:
            equals:
              kubernetes.labels.beat.k8s.elastic.co/name: filebeat

    # Route audit events and container logs to separate data streams so they
    # can have different ILM policies: audit data is the compliance-relevant
    # one and is kept far longer than application chatter.
    output.elasticsearch:
      indices:
        - index: "logs-kubernetes.audit-default"
          when.contains:
            tags: "kubernetes-audit"
        - index: "logs-kubernetes.container-default"

  daemonSet:
    podTemplate:
      metadata:
        labels:
          app.kubernetes.io/part-of: oke-sentinel
      spec:
        serviceAccountName: filebeat
        automountServiceAccountToken: true
        terminationGracePeriodSeconds: 30
        # Reading other containers' logs is the job, and those files are owned
        # by root on the host.
        securityContext:
          runAsUser: 0
        dnsPolicy: ClusterFirstWithHostNet
        containers:
          - name: filebeat
            env:
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            resources:
              requests:
                memory: 200Mi
                cpu: 100m
              limits:
                memory: 400Mi
                cpu: 500m
            volumeMounts:
              - name: varlogcontainers
                mountPath: /var/log/containers
                readOnly: true
              - name: varlogpods
                mountPath: /var/log/pods
                readOnly: true
              - name: varlibdockercontainers
                mountPath: /var/lib/docker/containers
                readOnly: true
              - name: varlogaudit
                mountPath: /var/log/kubernetes/audit
                readOnly: true
        volumes:
          - name: varlogcontainers
            hostPath:
              path: /var/log/containers
          - name: varlogpods
            hostPath:
              path: /var/log/pods
          - name: varlibdockercontainers
            hostPath:
              path: /var/lib/docker/containers
          # DirectoryOrCreate rather than Directory: on a managed control plane
          # this directory does not exist, and a missing hostPath would keep
          # the DaemonSet from starting at all.
          - name: varlogaudit
            hostPath:
              path: /var/log/kubernetes/audit
              type: DirectoryOrCreate
