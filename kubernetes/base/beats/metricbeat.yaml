apiVersion: beat.k8s.elastic.co/v1beta1
kind: Beat
metadata:
  name: metricbeat
  namespace: elastic-system
  labels:
    app.kubernetes.io/part-of: oke-sentinel
spec:
  type: metricbeat
  version: 9.5.0
  elasticsearchRef:
    name: sentinel

  config:
    metricbeat.modules:
      # Node-level metrics, collected by every pod in the DaemonSet from the
      # kubelet on its own node.
      - module: kubernetes
        period: 30s
        node: ${NODE_NAME}
        hosts:
          - https://${NODE_NAME}:10250
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        ssl.verification_mode: none
        metricsets:
          - node
          - system
          - pod
          - container
          - volume

      # System metrics from the host itself, which is why the DaemonSet mounts
      # /proc and /sys read-only below.
      - module: system
        period: 30s
        metricsets:
          - cpu
          - load
          - memory
          - network
          - filesystem
        processes: [".*"]
        process.include_top_n:
          by_cpu: 5
          by_memory: 5

    # Cluster-scoped metrics must be collected exactly once, not once per node.
    # The leader election lease in rbac.yaml is what makes that true; without
    # it every node reports the same cluster state and the numbers are wrong by
    # a factor of the node count.
    metricbeat.autodiscover:
      providers:
        - type: kubernetes
          scope: cluster
          node: ${NODE_NAME}
          unique: true
          identifier: leader-election
          templates:
            - config:
                - module: kubernetes
                  period: 30s
                  hosts: ["kube-state-metrics.kube-system.svc:8080"]
                  # These require kube-state-metrics to be installed. If it is
                  # not, this module logs a connection error and the rest of
                  # Metricbeat carries on.
                  metricsets:
                    - state_node
                    - state_deployment
                    - state_daemonset
                    - state_statefulset
                    - state_pod
                    - state_container
                    - state_persistentvolumeclaim

    processors:
      - add_cloud_metadata: {}
      - add_host_metadata: {}

  daemonSet:
    podTemplate:
      metadata:
        labels:
          app.kubernetes.io/part-of: oke-sentinel
      spec:
        serviceAccountName: metricbeat
        automountServiceAccountToken: true
        terminationGracePeriodSeconds: 30
        # Host metrics come from the host's own namespaces.
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet
        securityContext:
          runAsUser: 0
        containers:
          - name: metricbeat
            env:
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            resources:
              requests:
                memory: 200Mi
                cpu: 100m
              limits:
                memory: 400Mi
                cpu: 500m
            volumeMounts:
              - name: proc
                mountPath: /hostfs/proc
                readOnly: true
              - name: cgroup
                mountPath: /hostfs/sys/fs/cgroup
                readOnly: true
        volumes:
          - name: proc
            hostPath:
              path: /proc
          - name: cgroup
            hostPath:
              path: /sys/fs/cgroup
