# The two secrets that come out of OCI Vault.
#
# Note what is *not* here: credentials for Filebeat, Metricbeat or Kibana to
# talk to Elasticsearch. Those components declare `elasticsearchRef` and ECK
# issues each of them its own service account, wires in the CA, and rotates the
# credential. Adding Vault-managed passwords for them would be strictly worse —
# more secrets, manually rotated, for no gain.
#
# What genuinely needs to come from Vault is the credential used from outside
# ECK's control: the administrative user a human logs in with and the
# governance CLI indexes findings as, plus Kibana's saved-object encryption
# key, which must survive a pod restart and must not be generated per replica.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: elastic-credentials
  namespace: elastic-system
  labels:
    app.kubernetes.io/part-of: oke-sentinel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: sentinel-elastic-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        username: sentinel-admin
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        # The secret name in OCI Vault, created by the vault module.
        key: elastic-superuser-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kibana-keystore
  namespace: elastic-system
  labels:
    app.kubernetes.io/part-of: oke-sentinel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: sentinel-kibana-keystore
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # ECK turns each key of a secureSettings secret into a keystore entry
        # of the same name, so this key has to be the literal Kibana setting.
        xpack.encryptedSavedObjects.encryptionKey: "{{ .encryptionKey }}"
  data:
    - secretKey: encryptionKey
      remoteRef:
        key: kibana-encryption-key
