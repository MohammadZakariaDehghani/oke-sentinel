# Reading secrets from OCI Vault without holding a credential.
#
# The service account below is the one named in the dynamic group matching rule
# in terraform/modules/vault/workload_identity.tf. OKE mints a token for it,
# OCI IAM evaluates that token against the rule, and the operator gets
# permission to read secret bundles in the compartment — with no API signing
# key anywhere in the cluster.
#
# The names must match on both sides. Changing the namespace or the service
# account name here without changing the Terraform produces an authorisation
# failure that looks like a network problem.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  namespace: external-secrets
  labels:
    app.kubernetes.io/part-of: oke-sentinel
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: oci-vault
  labels:
    app.kubernetes.io/part-of: oke-sentinel
spec:
  provider:
    oracle:
      # Both are placeholders patched per environment: the overlays substitute
      # the real region and vault OCID, which come from the Terraform outputs.
      region: PATCHED_BY_OVERLAY
      vault: PATCHED_BY_OVERLAY
      principalType: Workload
      auth:
        workloadIdentity:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
