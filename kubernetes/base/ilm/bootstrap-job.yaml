# Post-install configuration of Elasticsearch.
#
# Three things have to happen after the cluster is up and before anything
# writes to it: the ILM policies must exist, the index templates must exist
# (a data stream created without its template gets dynamic mappings and the
# wrong field types, which cannot be fixed in place), and the application user
# must be created from the Vault-sourced password.
#
# All of it is idempotent — PUTs, not POSTs — so re-running the Job after a
# password rotation or a policy change is the supported way to apply them.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-bootstrap-script
  namespace: elastic-system
  labels:
    app.kubernetes.io/part-of: oke-sentinel
data:
  bootstrap.sh: |
    #!/bin/sh
    set -eu

    ES="https://sentinel-es-http.elastic-system.svc:9200"
    CACERT=/etc/es-certs/ca.crt
    AUTH="elastic:$(cat /etc/es-auth/elastic)"

    es() {
      # $1 method, $2 path, $3 optional body file
      if [ $# -eq 3 ]; then
        curl -sS --fail-with-body --cacert "$CACERT" -u "$AUTH" \
          -X "$1" "$ES$2" -H 'Content-Type: application/json' --data-binary "@$3"
      else
        curl -sS --fail-with-body --cacert "$CACERT" -u "$AUTH" -X "$1" "$ES$2"
      fi
    }

    echo "waiting for Elasticsearch to accept connections"
    # yellow, not green: a single-node cluster can never be green, because the
    # replicas it is told to keep have nowhere to go. Waiting for green here is
    # the single most common way this Job hangs forever in a local setup.
    curl -sS --fail --cacert "$CACERT" -u "$AUTH" --retry 60 --retry-delay 5 --retry-all-errors \
      "$ES/_cluster/health?wait_for_status=yellow&timeout=120s" > /dev/null
    echo "Elasticsearch is up"

    for policy in kubernetes-audit kubernetes-container oci-inventory; do
      echo "applying ILM policy sentinel-$policy"
      es PUT "/_ilm/policy/sentinel-$policy" "/etc/ilm/ilm-$policy.json" > /dev/null
    done

    for tpl in kubernetes-audit kubernetes-container oci-inventory; do
      echo "applying index template sentinel-$tpl"
      es PUT "/_index_template/sentinel-$tpl" "/etc/ilm/template-$tpl.json" > /dev/null
    done

    # The application user, from the password the External Secrets Operator
    # pulled out of OCI Vault. Absent in the local and CI paths, where there is
    # no OCI Vault to read from — the Beats and Kibana authenticate through
    # ECK's own generated credentials either way, so skipping it costs nothing.
    if [ -f /etc/app-auth/password ]; then
      echo "creating or updating the sentinel-admin user"
      cat > /tmp/user.json <<JSON
    {
      "password": "$(cat /etc/app-auth/password)",
      "roles": ["superuser"],
      "full_name": "OKE Sentinel administrative user",
      "metadata": { "managed_by": "oke-sentinel-bootstrap" }
    }
    JSON
      es PUT "/_security/user/sentinel-admin" /tmp/user.json > /dev/null
      rm -f /tmp/user.json
    else
      echo "no Vault-sourced password mounted; skipping user creation"
    fi

    echo "bootstrap complete"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: sentinel-bootstrap
  namespace: elastic-system
  labels:
    app.kubernetes.io/part-of: oke-sentinel
spec:
  backoffLimit: 6
  # Keep the pod around for an hour so its logs are readable after it finishes.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: oke-sentinel
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: curlimages/curl:8.19.0
          command: ["/bin/sh", "/scripts/bootstrap.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: 32Mi
              cpu: 50m
            limits:
              memory: 64Mi
              cpu: 200m
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: ilm
              mountPath: /etc/ilm
              readOnly: true
            - name: es-auth
              mountPath: /etc/es-auth
              readOnly: true
            - name: es-certs
              mountPath: /etc/es-certs
              readOnly: true
            - name: app-auth
              mountPath: /etc/app-auth
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: sentinel-bootstrap-script
        - name: ilm
          configMap:
            name: sentinel-ilm
        # Created by ECK alongside the Elasticsearch resource.
        - name: es-auth
          secret:
            secretName: sentinel-es-elastic-user
        - name: es-certs
          secret:
            secretName: sentinel-es-http-certs-public
        # Created by the External Secrets Operator from OCI Vault. Optional, so
        # that the local and CI paths work without any OCI dependency at all.
        - name: app-auth
          secret:
            secretName: sentinel-elastic-credentials
            optional: true
        - name: tmp
          emptyDir: {}
