apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The base is what every environment shares. Two things are deliberately not
# here:
#
#   storage/     the OCI Block Volume StorageClass, which is meaningless on
#                kind and would fail to provision
#   external-secrets/  which requires an OCI Vault to read from
#
# Both are pulled in by the dev and prod overlays instead, so the local overlay
# stays free of any OCI dependency and CI can run the whole pipeline without a
# tenancy.
resources:
  - namespaces.yaml
  - elasticsearch/elasticsearch.yaml
  - kibana/kibana.yaml
  - beats/rbac.yaml
  - beats/filebeat.yaml
  - beats/metricbeat.yaml
  - ilm/policies.yaml
  - ilm/bootstrap-job.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/managed-by: kustomize
