apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Development on OKE. Real OCI Block Volume storage and real secrets from OCI
# Vault, but sized for two worker nodes rather than three.

resources:
  - ../../base
  - ../../base/storage
  - ../../base/external-secrets

patches:
  - path: patch-elasticsearch-dev.yaml
    target:
      kind: Elasticsearch
      name: sentinel

  - path: patch-secretstore.yaml
    target:
      kind: ClusterSecretStore
      name: oci-vault
