# Replace both values before applying this overlay.
#
# They are placeholders because a vault OCID identifies a real tenancy, and
# this repository is public and contains no real tenancy identifiers. Take the
# OCID from the `vault_id` output of terraform/environments/dev, and the region
# from the same stack's region variable.
#
#   terraform -chdir=terraform/environments/dev output -raw vault_id
- op: replace
  path: /spec/provider/oracle/region
  value: eu-frankfurt-1
- op: replace
  path: /spec/provider/oracle/vault
  value: ocid1.vault.oc1.eu-frankfurt-1.exampleexample.abcdefghijklmnopqrstuvwxyzexampleexampleexam
