apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production on OKE. The base is already sized for this, so the overlay's job
# is to add the things that only make sense against a real tenancy — block
# volume storage and OCI Vault — and to bind the data volumes to the retaining
# storage class.

resources:
  - ../../base
  - ../../base/storage
  - ../../base/external-secrets

patches:
  - path: patch-elasticsearch-storage.yaml
    target:
      kind: Elasticsearch
      name: sentinel

  - path: patch-secretstore.yaml
    target:
      kind: ClusterSecretStore
      name: oci-vault

  - path: patch-kibana-ha.yaml
    target:
      kind: Kibana
      name: sentinel
