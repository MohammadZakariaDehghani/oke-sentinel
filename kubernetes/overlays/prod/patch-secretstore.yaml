# Replace both values before applying this overlay. Placeholders, for the same
# reason as everywhere else in this repository: no real tenancy identifiers.
#
#   terraform -chdir=terraform/environments/prod output -raw vault_id
- op: replace
  path: /spec/provider/oracle/region
  value: eu-frankfurt-1
- op: replace
  path: /spec/provider/oracle/vault
  value: ocid1.vault.oc1.eu-frankfurt-1.exampleexample.abcdefghijklmnopqrstuvwxyzexampleexampleexam
