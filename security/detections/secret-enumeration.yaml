id: secret-enumeration
name: Bulk reading of secrets by a single identity
severity: high
enabled: true
type: threshold

index: logs-kubernetes.audit-*
interval: 5m
lookback: 10m

threshold:
  field: user.username
  value: 25

description: >-
  One identity successfully read or listed secrets more than twenty-five times
  in ten minutes.

rationale: >-
  Workloads read their own secrets, once, at startup. They do not sweep them.
  A burst of successful secret reads from one identity is either a controller
  doing its job — of which there are a known handful — or someone harvesting
  credentials after gaining access.

  This is the counterpart to rbac-denied-burst: that rule catches an identity
  being told no, this one catches an identity being told yes. The second is
  worse. By the time this fires, credentials have already left the cluster's
  control, and the response is rotation rather than containment.

  Note the audit policy records secrets at Metadata level only, deliberately.
  Logging the request body would copy every secret's contents into the audit
  index, which would then need protecting like a secret store, and the audit
  index is replicated, backed up and searchable by more people. This rule needs
  to know who read what, not what it said, so metadata is sufficient.

mitre:
  - tactic: Credential Access
    tactic_id: TA0006
    technique: Unsecured Credentials
    technique_id: T1552
  - tactic: Credential Access
    tactic_id: TA0006
    technique: Container API
    technique_id: T1552.007

false_positives:
  - The External Secrets Operator, cert-manager and the token controller all
    read secrets in volume as their normal function. They are excluded by name
    below.
  - A cluster-wide backup job. Allowlist it explicitly; it is exactly the kind
    of thing an attacker would like you to have allowlisted broadly.

response:
  - Rotate everything the identity could reach. Assume the reads succeeded,
    because the rule only fires on successful ones.
  - Determine the namespace spread. One namespace suggests a broken client;
    reads across namespaces suggest a sweep.
  - If the identity is a service account, the pod holding its token is the
    compromised asset.

query:
  bool:
    filter:
      - term:
          stage: ResponseComplete
      - terms:
          verb: [get, list]
      - term:
          objectRef.resource: secrets
      - range:
          responseStatus.code:
            lt: 400
    must_not:
      # Controllers whose job is reading secrets. Every entry is a blind spot,
      # so each is a named service account rather than a namespace or a prefix.
      - terms:
          user.username:
            - system:kube-controller-manager
            - system:serviceaccount:kube-system:token-controller
            - system:serviceaccount:kube-system:generic-garbage-collector
            - system:serviceaccount:external-secrets:external-secrets
            - system:serviceaccount:elastic-system:elastic-operator
      - terms:
          user.groups:
            - system:nodes

aggregation:
  terms:
    field: user.username
    size: 50
    min_doc_count: 26

fixtures:
  match:
    - description: Thirty successful secret reads from one compromised workload
      repeat: 30
      event:
        stage: ResponseComplete
        verb: get
        user:
          username: system:serviceaccount:sample-app:sample-api
          groups: ["system:serviceaccounts", "system:authenticated"]
        sourceIPs: ["10.20.64.14"]
        objectRef:
          resource: secrets
          namespace: kube-system
          name: some-credential
        responseStatus:
          code: 200

  no_match:
    - description: A handful of reads by a workload starting up
      repeat: 4
      event:
        stage: ResponseComplete
        verb: get
        user:
          username: system:serviceaccount:sample-app:sample-api
        objectRef:
          resource: secrets
          namespace: sample-app
          name: sample-api-config
        responseStatus:
          code: 200

    - description: The External Secrets Operator doing its job, in volume
      repeat: 60
      event:
        stage: ResponseComplete
        verb: list
        user:
          username: system:serviceaccount:external-secrets:external-secrets
        objectRef:
          resource: secrets
          namespace: elastic-system
        responseStatus:
          code: 200

    - description: Denied secret reads belong to the RBAC probing rule
      repeat: 40
      event:
        stage: ResponseComplete
        verb: list
        user:
          username: system:serviceaccount:sample-app:sample-api
        objectRef:
          resource: secrets
          namespace: kube-system
        responseStatus:
          code: 403
