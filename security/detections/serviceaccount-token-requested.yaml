id: serviceaccount-token-requested
name: Service account token minted or long-lived token secret created
severity: high
enabled: true
type: query

index: logs-kubernetes.audit-*
interval: 5m
lookback: 5m

description: >-
  Someone called the TokenRequest API to mint a token for a service account, or
  created a Secret of type kubernetes.io/service-account-token.

rationale: >-
  A service account token is a bearer credential for the Kubernetes API. Since
  1.24, pods get short-lived projected tokens automatically and no controller
  needs to mint one on demand — so a TokenRequest from an interactive identity
  is someone deliberately extracting a credential they can use elsewhere. It is
  the cluster equivalent of exporting a long-lived API key.

  The second half of this rule catches the older, worse pattern: creating a
  Secret of type kubernetes.io/service-account-token produces a token that
  never expires and is not tied to a pod's lifetime. There is almost no good
  reason to do this in a modern cluster, and it is a common persistence
  mechanism precisely because it survives everything short of deleting the
  secret.

  A token minted for a high-privilege service account is the interesting case.
  Correlate this with cluster-admin-binding-created — minting a token and then
  binding it, or binding first and then minting, is a complete privilege
  escalation chain in two events.

mitre:
  - tactic: Credential Access
    tactic_id: TA0006
    technique: Steal Application Access Token
    technique_id: T1528
  - tactic: Persistence
    tactic_id: TA0003
    technique: Valid Accounts
    technique_id: T1078

false_positives:
  - CI systems that mint a short-lived token to talk to the cluster. Those come
    from a known service account and a known source IP; allowlist the specific
    identity, not the whole rule.
  - Some older operators still create token secrets for themselves.

response:
  - Establish which service account the token was minted *for*
    (objectRef.name), not just who asked for it.
  - Check what that service account is bound to. A token for a service account
    with no interesting permissions is noise; one for a cluster-admin-bound
    account is an incident.
  - Long-lived token secrets should be deleted and the workload moved to a
    projected volume.

query:
  bool:
    filter:
      - term:
          stage: ResponseComplete
      - term:
          verb: create
      - range:
          responseStatus.code:
            lt: 400
    minimum_should_match: 1
    should:
      # TokenRequest against a service account subresource.
      - bool:
          filter:
            - term:
                objectRef.resource: serviceaccounts
            - term:
                objectRef.subresource: token
      # A long-lived service account token secret.
      - bool:
          filter:
            - term:
                objectRef.resource: secrets
            - term:
                requestObject.type: kubernetes.io/service-account-token
    must_not:
      # The kubelet and the token controller mint tokens continuously as part
      # of normal pod admission.
      - terms:
          user.username:
            - system:kube-controller-manager
            - system:serviceaccount:kube-system:token-controller
      - terms:
          user.groups:
            - system:nodes

fixtures:
  match:
    - description: A human mints a token for a service account
      event:
        stage: ResponseComplete
        verb: create
        user:
          username: bob@example.com
          groups: ["system:authenticated"]
        sourceIPs: ["10.20.2.31"]
        objectRef:
          resource: serviceaccounts
          subresource: token
          namespace: kube-system
          name: deployer
        responseStatus:
          code: 201

    - description: A long-lived service account token secret is created
      event:
        stage: ResponseComplete
        verb: create
        user:
          username: bob@example.com
        objectRef:
          resource: secrets
          namespace: default
          name: deployer-token-permanent
        responseStatus:
          code: 201
        requestObject:
          type: kubernetes.io/service-account-token

  no_match:
    - description: The kubelet minting a projected token during pod admission
      event:
        stage: ResponseComplete
        verb: create
        user:
          username: system:node:worker-1
          groups: ["system:nodes", "system:authenticated"]
        objectRef:
          resource: serviceaccounts
          subresource: token
          namespace: sample-app
          name: sample-api
        responseStatus:
          code: 201

    - description: An ordinary opaque secret
      event:
        stage: ResponseComplete
        verb: create
        user:
          username: system:serviceaccount:external-secrets:external-secrets
        objectRef:
          resource: secrets
          namespace: elastic-system
          name: sentinel-elastic-credentials
        responseStatus:
          code: 201
        requestObject:
          type: Opaque

    - description: Reading a service account is not minting a token
      event:
        stage: ResponseComplete
        verb: get
        user:
          username: bob@example.com
        objectRef:
          resource: serviceaccounts
          namespace: kube-system
          name: deployer
        responseStatus:
          code: 200
